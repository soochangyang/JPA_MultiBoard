# 1. 콘솔(화면)에 로그 출력
appender=com.p6spy.engine.spy.appender.StdoutLogger

# 2. 커스텀 로그 포맷 사용
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

# 3. 💡 핵심: 내가 원하는 형태로 로그 메세지 예쁘게 조립하기
customLogMessageFormat=\n[P6Spy 진짜 쿼리] (실행시간: %(executionTime)ms)\n%(sqlSingleLine)\n

# 4. 보기 귀찮은 commit, result 세팅 등의 불필요한 로그는 숨기기 (오직 SQL만 출력)
excludecategories=info,debug,result,commit,rollback